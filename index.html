<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f59a5f">
<title>Evidence doučování SEA-l</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Paleta podle sea-l.cz: teplý přechod od bílé k mangově oranžové, uhlové tlačítka, šedá kresba. */
:root{
  --bg:#fff8f1; --surface:#ffffff; --line:#eddfd1; --ink:#2b2724; --muted:#6e645a;
  --brand:#ef7d3c; --brand-ink:#b4501a; --mango:#f3b229; --cream:#fbefc6; --soft:#fde6d3;
  --btn:#333333; --btn-ink:#ffffff;
  --good:#2c7a4b; --good-bg:#e2f2e7; --warn:#935f00; --warn-bg:#fdefc9; --bad:#b0362e; --bad-bg:#fbe0dc; --idle-bg:#f2ebe4;
  --head:linear-gradient(115deg,#ffffff 0%,#fde9d8 45%,#f9c08f 80%,#f59a5f 100%);
  --font:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1c1916; --surface:#25211d; --line:#3a332c; --ink:#f3ece4; --muted:#b4a797;
    --brand:#f39a5e; --brand-ink:#f6a875; --mango:#f3b229; --cream:#3a3020; --soft:#3b2a1f;
    --btn:#f3ece4; --btn-ink:#1c1916;
    --good:#74d29b; --good-bg:#183526; --warn:#f2c35a; --warn-bg:#3b2f12; --bad:#f28c82; --bad-bg:#40201c; --idle-bg:#2e2924;
    --head:linear-gradient(115deg,#25211d 0%,#3a2a1f 55%,#6b3a1d 100%);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1c1916; --surface:#25211d; --line:#3a332c; --ink:#f3ece4; --muted:#b4a797;
  --brand:#f39a5e; --brand-ink:#f6a875; --mango:#f3b229; --cream:#3a3020; --soft:#3b2a1f;
  --btn:#f3ece4; --btn-ink:#1c1916;
  --good:#74d29b; --good-bg:#183526; --warn:#f2c35a; --warn-bg:#3b2f12; --bad:#f28c82; --bad-bg:#40201c; --idle-bg:#2e2924;
  --head:linear-gradient(115deg,#25211d 0%,#3a2a1f 55%,#6b3a1d 100%);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

header{background:var(--head);border-bottom:1px solid var(--line)}
.head-in,.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:14px;padding:16px 0 12px;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:700;font-size:.8rem;letter-spacing:.04em;flex:none}
.title h1{font-size:1.35rem;font-weight:600;margin:0;letter-spacing:.02em}
.title p{margin:0;color:var(--muted);font-size:.85rem;letter-spacing:.06em}
.sync{margin-left:auto;font-size:.82rem;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.busy i{background:var(--mango)} .sync.err i{background:var(--bad)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:3px;font-weight:600;font-size:.9rem;letter-spacing:.04em;white-space:nowrap;background:rgba(255,255,255,.55)}
nav a:hover{background:var(--surface)}
nav a[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}
:root[data-theme="dark"] nav a:not([aria-current="page"]){background:rgba(0,0,0,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav a:not([aria-current="page"]){background:rgba(0,0,0,.25)}}

.wrap{padding-top:20px;padding-bottom:70px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .grow{flex:1 1 220px}
.bar .w{flex:0 1 200px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=month],input[type=tel],input[type=email],input[type=time],input[type=password],select,textarea{
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:9px 11px;min-height:42px;width:100%}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:3px;padding:9px 15px;min-height:42px;font-weight:600;letter-spacing:.03em;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:34px;padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
a.btn{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--brand);color:var(--brand-ink);font-weight:700}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-top:4px solid var(--mango)}
.tile.o{border-top-color:var(--brand)} .tile.g{border-top-color:var(--good)} .tile.r{border-top-color:var(--bad)} .tile.c{border-top-color:var(--btn)}
.tile b{display:block;font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.tile span{color:var(--muted);font-size:.84rem}
h2{font-size:1.08rem;font-weight:700;letter-spacing:.02em;margin:26px 0 10px;text-wrap:balance;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2 .sub{font-weight:400}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;background:var(--bg)}
.row.click{cursor:pointer}
.row.click:hover{background:var(--soft)}
.num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.88rem}
.name{font-weight:600;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.money{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.idle{background:var(--idle-bg);color:var(--muted)}
.pill.tag{background:var(--cream);color:var(--ink);font-weight:600}
.row input,.row select{min-height:36px;padding:5px 8px}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:.86rem;margin:8px 2px 0}
.note{background:var(--cream);border:1px solid var(--mango);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.note .grow{flex:1 1 260px}
.scroll{overflow-x:auto}

.r-kids{grid-template-columns:2rem minmax(0,2fr) minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr) 6rem}
.r-pay{grid-template-columns:minmax(0,1.8fr) 6rem 6rem 7.5rem 9rem 7rem 7.5rem}
.r-exp{grid-template-columns:5.5rem minmax(0,1fr) minmax(0,1.6fr) 7rem}
.cats{display:grid;gap:2px;padding:6px 0}
.cat{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) 6.5rem;gap:10px;align-items:center;padding:7px 14px;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:8px}
.cat:hover,.cat[aria-pressed="true"]{background:var(--soft,rgba(0,0,0,.05))}
.cat .track{height:10px;border-radius:5px;background:rgba(0,0,0,.06);overflow:hidden}
.cat .track i{display:block;height:100%;background:var(--brand);border-radius:5px}
.cat b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.exp-total{display:flex;justify-content:space-between;padding:10px 14px;font-weight:700;border-top:1px solid var(--line,rgba(0,0,0,.1))}
.r-wage{grid-template-columns:minmax(0,1.3fr) 5rem 5rem 6rem 7rem 7rem 8.5rem}
.r-tea{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 6rem minmax(0,1.6fr) 7.5rem}
.r-att{grid-template-columns:2rem minmax(0,1.6fr) auto}
table.work td,table.work th{padding:4px 6px;vertical-align:middle}
table.work th.r,table.work td.r{text-align:center}
table.work td{text-align:center}
table.work td:first-child,table.work td:nth-child(2),table.work td:last-child{text-align:left}
table.work input{width:4.4rem;min-height:32px;padding:3px 6px;text-align:right;font-variant-numeric:tabular-nums}
table.work input.wn{width:100%;min-width:9rem;text-align:left}
table.work tr.we td{background:var(--bg)}
table.work tr.today td{background:var(--cream)}
table.work tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.r-two{grid-template-columns:minmax(0,1fr) auto}
.r-three{grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) auto}

.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--brand)}
.card.col{border-top:5px solid var(--cc)}
.lesson-h .dot{width:12px;height:12px;border-radius:50%;background:var(--cc, var(--brand));flex:none}
.lesson-f .lbl{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);align-content:start}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--ink)}
.swatches i{width:18px;height:18px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.card h3{margin:0;font-size:1.02rem;font-weight:700}
.card .meta{color:var(--muted);font-size:.86rem}
.cap{display:grid;gap:4px}
.cap .track{height:10px}
.track{background:var(--idle-bg);border-radius:999px;overflow:hidden;height:14px}
.fill{height:100%;background:var(--mango);border-radius:999px}
.fill.full{background:var(--brand)} .fill.over{background:var(--bad)}
.cap-line{display:flex;justify-content:space-between;font-size:.84rem;font-variant-numeric:tabular-nums}

.week{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:8px;min-width:780px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:grid;gap:6px;align-content:start}
.day h4{margin:0 0 2px;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.slot{border-left:5px solid var(--cc, var(--brand));background:var(--soft);border-radius:4px;padding:6px 8px;font-size:.84rem;cursor:pointer}
.slot b{display:block;font-size:.88rem}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;min-height:38px;cursor:pointer;font-weight:600;border-left:1.5px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].P{background:var(--good-bg);color:var(--good)}
.seg button[aria-pressed="true"].N{background:var(--bad-bg);color:var(--bad)}
.seg button[aria-pressed="true"].O{background:var(--warn-bg);color:var(--warn)}
.lesson{margin-bottom:20px}
.lesson-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.lesson-h h3{margin:0;font-size:1.02rem}
.lesson-f{display:grid;grid-template-columns:minmax(0,3fr) minmax(160px,1fr);gap:10px;margin-top:10px}
.lesson-f label{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav strong{font-size:1.08rem;min-width:9.5rem;text-align:center;font-weight:700}

table.grid{border-collapse:collapse;width:100%;font-size:.88rem}
table.grid th,table.grid td{padding:7px 9px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
table.grid thead th{background:var(--bg);color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;border-top:0}
table.grid td.r,table.grid th.r{text-align:right;font-variant-numeric:tabular-nums}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:.84rem;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.overlay{position:fixed;inset:0;background:rgba(30,20,12,.5);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:20}
.overlay.open{display:flex}
.dialog{background:var(--surface);border-radius:10px;padding:20px;width:100%;max-width:600px;border:1px solid var(--line);border-top:5px solid var(--brand)}
.dialog h3{font-size:1.2rem;margin:0 0 14px;font-weight:700}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label,.form .lbl{display:grid;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted)}
.form .full{grid-column:1/-1}
.checks{display:grid;gap:6px;max-height:220px;overflow:auto;border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px}
.checks label{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:.92rem}
.checks label.dis{color:var(--muted)}
.inline{display:flex;flex-wrap:wrap;gap:6px 16px}
.inline label{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);font-size:.92rem}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand-ink);flex:none}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.actions .left{margin-right:auto}
.err{color:var(--bad);font-size:.88rem;margin:10px 0 0;min-height:1em}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:6px;font-weight:600;display:none;z-index:30;max-width:92vw}
.toast.show{display:block}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px;display:grid;gap:14px;max-width:720px}
.welcome h2{margin:0;font-size:1.4rem}
.welcome .acts{display:flex;gap:10px;flex-wrap:wrap}
.settings{display:grid;gap:16px;max-width:760px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{margin:0 0 4px;font-size:1.02rem}
.panel p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.list-plain{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem}

@media (max-width:820px){
  .row.head{display:none}
  .r-kids{grid-template-columns:2rem 1fr auto} .r-kids .c-grp,.r-kids .c-crs,.r-kids .c-tel{display:none}
  .r-pay{grid-template-columns:1fr 1fr} .r-pay .name{grid-column:1/-1} .r-pay .c-meth,.r-pay .c-date{display:none}
  .r-pay label.mini{display:grid;gap:2px;font-size:.72rem;color:var(--muted)}
  .r-exp{grid-template-columns:4.5rem 1fr auto} .r-exp .c-note{grid-column:2/3}
  .cat{grid-template-columns:minmax(0,7.5rem) minmax(0,1fr) auto;padding:7px 10px}
  .r-wage{grid-template-columns:1fr auto} .r-wage .c-h,.r-wage .c-rate,.r-wage .c-les{display:none}
  .r-tea{grid-template-columns:1fr auto} .r-tea .c-tel,.r-tea .c-rate,.r-tea .c-crs{display:none}
  .r-att{grid-template-columns:1.6rem 1fr} .r-att .seg{grid-column:2/-1}
  .r-three{grid-template-columns:1fr auto} .r-three .c-mid{grid-column:1/-1;order:3}
  .form{grid-template-columns:1fr}
  .lesson-f{grid-template-columns:1fr}
}
@media (min-width:821px){ .r-pay label.mini span{display:none} }
</style>
</head>
<body>
<header><div class="head-in">
  <div class="top">
    <div class="logo" aria-hidden="true">SEA-l</div>
    <div class="title"><h1 id="appName">Evidence doučování</h1><p>SEA-l · děti, kurzy, učitelé, finance</p></div>
    <button class="sync" id="syncBadge" title="Stav ukládání"><i></i><span id="syncText">Uloženo v prohlížeči</span></button>
  </div>
  <nav aria-label="Hlavní">
    <a href="#prehled" data-v="prehled">Přehled</a>
    <a href="#deti" data-v="deti">Děti</a>
    <a href="#kurzy" data-v="kurzy">Kurzy a kapacita</a>
    <a href="#dochazka" data-v="dochazka">Docházka</a>
    <a href="#finance" data-v="finance">Finance</a>
    <a href="#ucitele" data-v="ucitele">Učitelé</a>
    <a href="#nastaveni" data-v="nastaveni">Nastavení</a>
  </nav>
</div></header>
<main class="wrap"><div id="notice"></div><div id="tools"></div><div id="view"></div></main>
<div class="overlay" id="overlay"><div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="xlsxFile" accept=".xlsx,.xls,.ods,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>

<script>
"use strict";
/* =========================================================
   Základ
   ========================================================= */
const STORE_KEY = "sea-l-evidence-v1", GH_KEY = "sea-l-evidence-github";
const DAYS = ["Pondělí","Úterý","Středa","Čtvrtek","Pátek","Sobota","Neděle"];
const DAYS_SHORT = ["Po","Út","St","Čt","Pá","So","Ne"];
const MONTHS = ["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];
const EXP_CATS = ["Lektor","Nájem","Energie a účty","Vybavení a dekorace","Pomůcky","Jídlo a pití","Akce a výlety","Reklama","Jiné"];
const expCats = () => [...new Set([...EXP_CATS, ...S.expenses.map(e => e.category).filter(Boolean)])];
const METHODS = {"":"—", hotove:"Hotově", prevod:"Převodem"};
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kc = n => Math.round(Number(n)||0).toLocaleString("cs-CZ") + " Kč";
const pad = n => String(n).padStart(2,"0");
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const now = new Date();
const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const todayYm = todayStr.slice(0,7);
const ymLabel = ym => `${MONTHS[Number(ym.slice(5))-1]} ${ym.slice(0,4)}`;
const MONTHS_SHORT = ["Led","Úno","Bře","Dub","Kvě","Čvn","Čvc","Srp","Zář","Říj","Lis","Pro"];
const ymShort = ym => `${MONTHS_SHORT[Number(ym.slice(5))-1]} ${ym.slice(2,4)}`;

/* =========================================================
   GitHub synchronizace (soukromý repozitář s data.json)
   ========================================================= */
const clone = x => x === undefined ? undefined : JSON.parse(JSON.stringify(x));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const isObj = x => !!x && typeof x === "object" && !Array.isArray(x);
const isRecArr = a => Array.isArray(a) && a.every(x => isObj(x) && typeof x.id === "string");
/* Tříbodové sloučení: base = poslední společná verze, l = moje změny, r = změny ostatních.
   Co změnil jen jeden, platí. Když dva změní totéž pole, vyhraje to, co se ukládá právě teď. */
function merge3(b, l, r){
  if (same(l, b)) return clone(r);
  if (same(r, b) || same(l, r)) return clone(l);
  if (isObj(l) && isObj(r)) {
    const bo = isObj(b) ? b : {}, out = {};
    new Set([...Object.keys(bo), ...Object.keys(l), ...Object.keys(r)]).forEach(k => { const v = merge3(bo[k], l[k], r[k]); if (v !== undefined) out[k] = v; });
    return out;
  }
  if (isRecArr(l) && isRecArr(r)) {
    const m = a => new Map((isRecArr(a) ? a : []).map(x => [x.id, x])), bm = m(b), lm = m(l), rm = m(r), out = [];
    [...new Set([...r.map(x => x.id), ...l.map(x => x.id)])].forEach(id => { const v = merge3(bm.get(id), lm.get(id), rm.get(id)); if (v !== undefined) out.push(v); });
    return out;
  }
  return clone(l);
}
const GH_BASE_KEY = "sea-l-evidence-github-base";
async function ghFetch(url, opts){ try { return await fetch(url, opts); } catch(e){ throw new Error("Nejde se spojit s GitHubem. Zkontroluj připojení k internetu."); } }
const GH = {
  cfg:null, sha:null, base:null, timer:null, busy:false, again:false, state:"off", msg:"",
  load(){
    try { this.cfg = JSON.parse(localStorage.getItem(GH_KEY) || "null"); } catch(e){ this.cfg = null; }
    try { const b = JSON.parse(localStorage.getItem(GH_BASE_KEY) || "null"); if (b && this.cfg) { this.base = normalize(b.data); this.sha = b.sha || null; } } catch(e){}
    this.state = this.cfg ? "idle" : "off";
  },
  saveCfg(){ try { if (this.cfg) localStorage.setItem(GH_KEY, JSON.stringify(this.cfg)); else { localStorage.removeItem(GH_KEY); localStorage.removeItem(GH_BASE_KEY); } } catch(e){} },
  saveBase(){ try { if (this.cfg && this.base) localStorage.setItem(GH_BASE_KEY, JSON.stringify({sha:this.sha, data:this.base})); } catch(e){} },
  url(extra=""){ const c = this.cfg; return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}${extra}`; },
  historyUrl(){ const c = this.cfg; return `https://github.com/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/commits/${encodeURIComponent(c.branch)}`; },
  fileUrl(){ return this.url("/contents/" + this.cfg.path.split("/").map(encodeURIComponent).join("/")); },
  headers(){ return { "Authorization": "Bearer " + this.cfg.token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; },
  enc(str){ const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); },
  dec(b64){ const bin = atob(b64.replace(/\s/g,"")); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); },
  set(state, msg){ this.state = state; this.msg = msg || ""; paintSync(); },
  async get(){
    const r = await ghFetch(this.fileUrl() + "?ref=" + encodeURIComponent(this.cfg.branch) + "&t=" + Date.now(), {headers:this.headers(), cache:"no-store"});
    if (r.status === 404) { this.sha = null; return null; }
    if (!r.ok) throw await this.error(r);
    const j = await r.json();
    if (!j.content && j.size > 0) throw new Error("Soubor s daty je větší než 1 MB, GitHub ho touto cestou nevydá.");
    this.sha = j.sha; return normalize(JSON.parse(this.dec(j.content || "") || "{}"));
  },
  async put(){
    const who = (this.cfg.name || "").trim();
    const body = { message:`Evidence: změny${who ? " · " + who : ""} · ${new Date().toLocaleString("cs-CZ")}`, content:this.enc(JSON.stringify(S, null, 1)), branch:this.cfg.branch };
    if (this.sha) body.sha = this.sha;
    const r = await ghFetch(this.fileUrl(), {method:"PUT", headers:{...this.headers(), "Content-Type":"application/json"}, body:JSON.stringify(body)});
    if (r.status === 409 || r.status === 422) { const e = new Error("conflict"); e.conflict = true; throw e; }
    if (!r.ok) throw await this.error(r);
    const j = await r.json(); this.sha = j.content && j.content.sha; this.base = clone(S); this.saveBase();
  },
  async error(r){
    let t = ""; try { t = (await r.json()).message || ""; } catch(e){}
    if (r.status === 401) return new Error("GitHub odmítl token. Zkontroluj, že je správně zkopírovaný a nevypršel.");
    if (r.status === 403) return new Error(/rate limit/i.test(t) ? "GitHub teď dočasně omezil počet požadavků. Zkus to za pár minut." : "Token nemá právo zapisovat. Dej mu oprávnění Contents: Read and write.");
    if (r.status === 404) return new Error("Repozitář nebyl nalezen, nebo k němu token nemá přístup.");
    return new Error(`GitHub vrátil chybu ${r.status}${t ? ": " + t : ""}.`);
  },
  merged(remote){ return normalize(merge3(this.base || {}, S, remote)); },
  stamp(){ return new Date().toLocaleTimeString("cs-CZ", {hour:"2-digit", minute:"2-digit"}); },
  schedule(){ if (!this.cfg) return; clearTimeout(this.timer); this.set("pending", "Čeká na uložení…"); this.timer = setTimeout(() => this.push(), 2000); },
  async push(){
    if (!this.cfg) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; clearTimeout(this.timer); this.set("busy", "Ukládám na GitHub…");
    try {
      for (let attempt = 0; ; attempt++) {
        try { await this.put(); break; }
        catch(e){
          if (!e.conflict || attempt >= 3) throw e.conflict ? new Error("Změny se nepodařilo spojit se změnami ostatních. Zkus to za chvíli znovu.") : e;
          const remote = await this.get();
          if (remote) { S = this.merged(remote); this.base = clone(remote); saveLocal(); this.saveBase(); renderKeepFocus(); }
        }
      }
      this.set("ok", "Uloženo na GitHubu " + this.stamp());
    }
    catch(e){ this.set("err", e.message || "Uložení na GitHub se nepovedlo."); }
    finally { this.busy = false; if (this.again) { this.again = false; this.push(); } }
  },
  /* Načte změny ostatních a spojí je s mými. */
  async refresh(quiet){
    if (!this.cfg || this.busy) return;
    this.busy = true; if (!quiet) this.set("busy", "Načítám z GitHubu…");
    let needPush = false;
    try {
      const remote = await this.get();
      if (!remote) { needPush = true; }
      else if (!this.base) { S = remote; this.base = clone(remote); }
      else if (!same(remote, this.base)) {
        const mine = !same(S, this.base);
        S = mine ? this.merged(remote) : remote; this.base = clone(remote);
        needPush = mine && !same(S, remote);
        saveLocal(); this.saveBase(); renderKeepFocus(); paintNotice();
      } else needPush = !same(S, this.base);
      saveLocal(); this.saveBase();
      if (!needPush) this.set("ok", "Aktuální z GitHubu " + this.stamp());
    } catch(e){ this.set("err", e.message || "GitHub teď není dostupný."); }
    finally { this.busy = false; }
    if (needPush) await this.push();
  }
};
function paintSync(){

    const lt = {}; Object.entries(d.attendance).forEach(([ds, recs]) => { if (ds.slice(0,7) !== ym) return; Object.entries(recs).forEach(([cid]) => { const c = C.find(x => x.id === cid); c.teacherIds.forEach(tid => { lt[tid] = (lt[tid]||0) + hoursOf(c); }); }); });
    if (m < 0) T.forEach(t => d.expenses.push({id:uid(), date:`${shiftYm(ym,1)}-05`, category:"Lektor", teacherId:t.id, amount:Math.round((lt[t.id]||0) * t.rate), note:`Výplata za ${ymLabel(ym).toLowerCase()}`, forYm:ym}));
    d.expenses.push({id:uid(), date:`${ym}-01`, category:"Nájem", teacherId:"", amount:18000, note:"Učebny Vimbau"});
    d.expenses.push({id:uid(), date:`${ym}-15`, category:"Energie a účty", teacherId:"", amount:3200 + Math.round(rnd()*400), note:""});
    d.expenses.push({id:uid(), date:`${ym}-10`, category:"Pomůcky", teacherId:"", amount:800 + Math.round(rnd()*900), note:"Sešity, pastelky"});
  }
  d.updatedAt = new Date().toISOString();
  return d;
}

const teacherOptions = (val, emptyLabel) => `<option value="">${emptyLabel}</option>${[...S.teachers].sort(byName).filter(t => t.active !== false || t.id === val).map(t => `<option value="${t.id}"${t.id===val?" selected":""}>${esc(t.name)}</option>`).join("")}`;
const courseOptions = (val, emptyLabel) => `<option value="">${emptyLabel}</option>${coursesSorted().map(c => `<option value="${c.id}"${c.id===val?" selected":""}>${esc(c.name)}</option>`).join("")}`;
function capBar(c){
  const n = enrolled(c).length, cap = capOf(c);
  if (!cap) return `<div class="cap"><div class="cap-line"><span>${pl(n, "dítě", "děti", "dětí")}</span><span class="sub">kapacita nevyplněna</span></div></div>`;
  const pct = Math.min(100, Math.round(100*n/cap)), cls = n > cap ? "over" : n === cap ? "full" : "";
  return `<div class="cap"><div class="cap-line"><span><b>${n}</b> z ${pl(cap, "místa", "míst", "míst")}</span><span>${n > cap ? `<span class="pill bad">přeplněno o ${n-cap}</span>` : n === cap ? `<span class="pill warn">plno</span>` : `<span class="pill good">volno ${cap-n}</span>`}</span></div>
    <div class="track" role="img" aria-label="Obsazeno ${n} z ${cap}"><div class="fill ${cls}" style="width:${pct}%"></div></div></div>`;
}
function barChart(months){
  const data = months.map(ym => { const f = monthFin(ym); return {ym, inc:f.received, out:f.spent}; });
  const max = Math.max(1, ...data.flatMap(d => [d.inc, d.out]));
  const step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max/step)*step;
  const W = 640, H = 220, L = 54, B = 26, T = 10, cw = (W - L - 8) / data.length, bw = Math.min(22, cw/3);
  const y = v => T + (H - T - B) * (1 - v/nice);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = nice*i/4; g += `<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v >= 1000 ? Math.round(v/1000) + " tis." : v}</text>`; }
  data.forEach((d,i) => { const cx = L + cw*i + cw/2;
    g += `<rect x="${cx-bw-1}" y="${y(d.inc)}" width="${bw}" height="${Math.max(0,H-B-y(d.inc))}" rx="2" fill="var(--brand)"><title>${ymLabel(d.ym)}: příjmy ${kc(d.inc)}</title></rect>`;
    g += `<rect x="${cx+1}" y="${y(d.out)}" width="${bw}" height="${Math.max(0,H-B-y(d.out))}" rx="2" fill="var(--muted)" opacity=".75"><title>${ymLabel(d.ym)}: výdaje ${kc(d.out)}</title></rect>`;
    g += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${d.ym === U.ym ? "var(--ink)" : "var(--muted)"}" font-weight="${d.ym === U.ym ? 700 : 400}">${ymShort(d.ym)}</text>`; });
  return `<div class="chart"><div class="legend"><span><i style="background:var(--brand)"></i>Vybrané platby</span><span><i style="background:var(--muted);opacity:.75"></i>Výdaje</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Příjmy a výdaje po měsících">${g}</svg></div>`;
}

function wageTable(ym){
  if (!S.teachers.length) return `<div class="sheet"><div class="empty">Zatím žádní učitelé.</div></div>`;
  const held = lessonsHeld(ym), wh = workHours(ym);
  const paidOut = tid => S.expenses.filter(e => e.category === "Lektor" && e.teacherId === tid && (e.forYm ? e.forYm === ym : (e.date||"").slice(0,7) === ym)).reduce((a,e) => a + (Number(e.amount)||0), 0);
  return `<div class="sheet"><div class="row head r-wage"><span>Učitel</span><span class="c-les">Lekcí</span><span class="c-h">Hodin</span><span class="c-rate">Sazba</span><span>Návrh</span><span>Vyplaceno</span><span></span></div>` +
    [...S.teachers].sort(byName).filter(t => t.active !== false || held.some(x => x.teacherIds.includes(t.id)) || wh[t.id] || paidOut(t.id)).map(t => {
      const mine = held.filter(x => x.teacherIds.includes(t.id)), fromWork = !!wh[t.id], hrs = fromWork ? wh[t.id] : mine.reduce((a,x) => a + x.hours, 0), sug = Math.round(hrs * (Number(t.rate)||0)), out = paidOut(t.id);
      return `<div class="row r-wage"><span class="name">${esc(t.name)}</span><span class="num c-les">${mine.length}</span><span class="num c-h">${hrs.toLocaleString("cs-CZ")} h<div class="sub">${hrs ? (fromWork ? "z výkazu" : "z docházky") : ""}</div></span><span class="num c-rate">${Number(t.rate) ? kc(t.rate) : "—"}</span>
        <span class="money">${Number(t.rate) ? kc(sug) : `<span class="sub">doplň sazbu</span>`}</span><span class="money">${out ? kc(out) : "—"}</span>
        <span>${sug && !out ? `<button class="btn small" data-wage="${t.id}" data-amount="${sug}">Zapsat výplatu</button>` : out ? `<span class="pill good">zapsáno</span>` : ""}</span></div>`; }).join("") +
    `</div><p class="hint">Návrh = odpracované hodiny × sazba učitele. Hodiny se berou z výkazu hodin; když lektorka v daném měsíci výkaz nemá, spočítají se ze zapsané docházky dětí. „Zapsat výplatu“ ho přidá mezi výdaje s datem, kdy výplatu zapisuješ, a tady se označí jako zapsaná.</p>`;
}

function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);

}

  if (v == null || v === "") return "";

  if ((m = s.match(/^(\d{4})-(\d{1,2})/))) return `${m[1]}-${pad(m[2])}`;
  if ((m = s.match(/^(\d{1,2})[./ ]+(\d{4})$/))) return `${m[2]}-${pad(m[1])}`;
  const i = MONTH_KEYS.findIndex(k => s.startsWith(k));
  if (i >= 0) { const y = s.match(/(\d{4})/); return y ? `${y[1]}-${pad(i + 1)}` : schoolYm(i); }
  return "";
}
function toDate(v){
  if (v == null || v === "") return "";
  if (typeof v === "number" && v > 20000 && v < 80000) { const d = serial(v); return d ? `${d[0]}-${pad(d[1])}-${pad(d[2])}` : ""; }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if ((m = s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/))) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;

/* =========================================================
   Přihlášení jménem a heslem (zašifrované tokeny v pristupy.json)
   ========================================================= */
const ACCESS_FILE = "pristupy.json";
function appRepo(){
  if (window.__APP_REPO) return window.__APP_REPO;
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i); if (!m) return null;
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return {owner:m[1], repo: seg && !/\.html?$/i.test(seg) ? seg : `${m[1]}.github.io`, branch:"main"};
}
const b64 = u8 => { let s = ""; u8.forEach(c => { s += String.fromCharCode(c); }); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function kdf(pass, salt, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(String(pass).normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function seal(text, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 600000;
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, await kdf(pass, salt, iter), new TextEncoder().encode(text)));
  return {salt:b64(salt), iv:b64(iv), ct:b64(ct), iter};
}
async function unseal(box, pass){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(box.iv)}, await kdf(pass, unb64(box.salt), box.iter), unb64(box.ct));
  return new TextDecoder().decode(pt);
}
function newPassword(){
  const abc = "abcdefghjkmnpqrstuvwxyz23456789", out = [];
  while (out.length < 12) { const b = crypto.getRandomValues(new Uint8Array(1))[0]; if (b < abc.length * 8) out.push(abc[b % abc.length]); }
  return out.join("").replace(/(.{4})(?=.)/g, "$1-");
}
const ACC = {
  data:null, sha:null,
  url(){ const a = appRepo(); return a ? `https://api.github.com/repos/${encodeURIComponent(a.owner)}/${encodeURIComponent(a.repo)}/contents/${ACCESS_FILE}` : null; },
  async load(withToken){
    const a = appRepo(), u = this.url();
    if (u) {
      const r = await ghFetch(`${u}?ref=${encodeURIComponent(a.branch || "main")}&t=${Date.now()}`, {headers: withToken && GH.cfg ? GH.headers() : {"Accept":"application/vnd.github+json"}, cache:"no-store"});
      if (r.status === 404) { this.data = {v:1, users:[]}; this.sha = null; return this.data; }
      if (r.ok) { const j = await r.json(); this.sha = j.sha; this.data = JSON.parse(GH.dec(j.content || "") || "{}"); }
      else if (!withToken) { try { const f = await fetch(ACCESS_FILE + "?t=" + Date.now(), {cache:"no-store"}); this.data = f.ok ? await f.json() : {v:1, users:[]}; } catch(e) { throw await GH.error(r); } }
      else throw await GH.error(r);
    } else { const f = await fetch(ACCESS_FILE + "?t=" + Date.now(), {cache:"no-store"}).catch(() => null); this.data = f && f.ok ? await f.json() : {v:1, users:[]}; }
    if (!Array.isArray(this.data.users)) this.data.users = [];
    return this.data;
  },
  async save(message){
    const a = appRepo(); if (!a) throw new Error("Přístupy jde spravovat jen v appce na adrese github.io.");
    const body = {message, content:GH.enc(JSON.stringify(this.data, null, 1)), branch:a.branch || "main"}; if (this.sha) body.sha = this.sha;
    const r = await ghFetch(this.url(), {method:"PUT", headers:{...GH.headers(), "Content-Type":"application/json"}, body:JSON.stringify(body)});
    if (r.status === 404 || r.status === 403) throw new Error(`Tvůj token nemůže zapisovat do repozitáře s appkou (${a.repo}). Na GitHubu otevři Settings → Developer settings → Fine-grained tokens → svůj token → Edit, v Repository access přidej i ${a.repo} a ulož. Pak to zkus znovu.`);
    if (r.status === 409 || r.status === 422) throw new Error("Soubor s přístupy se mezitím změnil. Obnov stránku a zkus to znovu.");
    if (!r.ok) throw await GH.error(r);
    const j = await r.json(); this.sha = j.content && j.content.sha;
  }
};
async function loginWith(name, pass, errEl){
  if (!name || !pass) { errEl.textContent = "Vyplň jméno i heslo."; return; }
  errEl.textContent = "Ověřuji…";
  try {
    const acc = await ACC.load(false);
    const u = acc.users.find(x => norm(x.name) === norm(name));
    let cfg = null;
    if (u) { try { cfg = JSON.parse(await unseal(u.box, pass)); } catch(e) { cfg = null; } }
    if (!cfg) { errEl.textContent = "Špatné jméno nebo heslo."; return; }
    await connectWith({...cfg, name:u.name, via:"login"}, errEl);
  } catch(e) { errEl.textContent = e.message || "Přihlášení se nepovedlo."; }
}
async function renderAccessPanel(){
  const box = $("#accessList"); if (!box) return;

  } catch(e) { if ($("#accessList")) $("#accessList").innerHTML = `<div class="empty" style="color:var(--bad)">${esc(e.message)}</div>`; }
}
async function addAccess(){
  const name = $("#acc_name").value.trim(), pass = $("#acc_pass").value.trim(), token = $("#acc_token").value.trim(), err = $("#accErr");
  $("#accResult").innerHTML = "";
  if (!name || !token) { err.textContent = "Vyplň jméno a token pro tohoto člověka."; return; }
  if (pass.length < 10) { err.textContent = "Heslo musí mít aspoň 10 znaků. Nech raději to vygenerované."; return; }
  err.textContent = "Ověřuji token…";
  try {
    const cfg = {owner:GH.cfg.owner, repo:GH.cfg.repo, branch:GH.cfg.branch, path:GH.cfg.path, token};
    const t = await ghFetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`, {headers:{"Authorization":"Bearer " + token, "Accept":"application/vnd.github+json"}, cache:"no-store"});
    if (!t.ok) { err.textContent = `Token pro ${name} k repozitáři ${cfg.repo} nefunguje. Zkontroluj, že má vybraný ${cfg.repo} a Contents: Read and write.`; return; }
    const tj = await t.json(); if (tj.permissions && tj.permissions.push === false) { err.textContent = "Token má jen čtení. Dej mu Contents: Read and write."; return; }
    err.textContent = "Ukládám přístup…";
    await ACC.load(true);
    if (ACC.data.users.some(u => norm(u.name) === norm(name))) { err.textContent = `Přístup pro jméno „${name}“ už existuje. Zvol jiné jméno, nebo ten starý nejdřív odeber.`; return; }
    ACC.data.users.push({id:uid(), name, added:todayStr, box: await seal(JSON.stringify(cfg), pass)});
    await ACC.save(`Přístup do evidence: ${name}`);
    err.textContent = "";
    const msg = `Evidence doučování SEA-l\n${location.origin}${location.pathname}\nJméno: ${name}\nHeslo: ${pass}`;
    $("#accResult").innerHTML = `<div class="note" style="margin:12px 0 0;display:grid;gap:8px"><b>Přístup pro ${esc(name)} je hotový.</b><span>Pošli mu tohle (heslo ideálně jinou cestou než odkaz):</span><pre style="margin:0;white-space:pre-wrap;font:inherit">${esc(msg)}</pre><div><button class="btn small" id="accCopy">Zkopírovat</button></div><span class="sub">Heslo si nikde neukládám, potom už ho neuvidíš. Kdyby ho zapomněl, odeber ho a vytvoř přístup znovu.</span></div>`;
    $("#accCopy").onclick = () => navigator.clipboard.writeText(msg).then(() => toast("Zkopírováno.")).catch(() => toast("Kopírování nejde, označ text ručně."));
    $("#acc_name").value = ""; $("#acc_token").value = ""; $("#acc_pass").value = newPassword();
    renderAccessPanel();
  } catch(e) { err.textContent = e.message || "Uložení přístupu se nepovedlo."; }
}
function delAccess(id){
  const u = (ACC.data && ACC.data.users || []).find(x => x.id === id); if (!u) return;
  confirmDlg(`Odebrat přístup pro ${u.name}?`, `${u.name} se už nepřihlásí jménem a heslem. Na zařízeních, kde je přihlášený, ale appka funguje dál, dokud na GitHubu nesmažeš i jeho token. Udělej obojí.`, "Odebrat", async () => {
    try { await ACC.load(true); ACC.data.users = ACC.data.users.filter(x => x.id !== id); await ACC.save(`Odebrán přístup: ${u.name}`); toast(`Přístup pro ${u.name} odebrán. Nezapomeň smazat i jeho token na GitHubu.`); renderAccessPanel(); }
    catch(e){ toast(e.message); } }, true);
}

async function connectGitHub(){
  const cfg = { owner:$("#gh_owner").value.trim(), repo:$("#gh_repo").value.trim(), branch:$("#gh_branch").value.trim() || "main", path:$("#gh_path").value.trim().replace(/^\/+/,"") || "data.json", token:$("#gh_token").value.trim(), name:$("#gh_name").value.trim(), via:"manual" };

async function connectWith(cfg, err){
  err.textContent = "Ověřuji…"; GH.cfg = cfg;
  try {
    const r = await ghFetch(GH.url(), {headers:GH.headers(), cache:"no-store"});
    if (!r.ok) { const e2 = await GH.error(r); if (r.status === 404) e2.message = `Repozitář ${cfg.owner}/${cfg.repo} nebyl nalezen, nebo k němu token nemá přístup. Zkontroluj uživatele na GitHubu (např. KhiemPham311), název repozitáře a že je v tokenu vybraný.`; throw e2; }
    const repo = await r.json();
    if (!repo.private) { GH.cfg = null; err.textContent = "Tento repozitář je veřejný. Data dětí patří do soukromého repozitáře, jinak by je viděl kdokoli."; return; }
    if (repo.permissions && repo.permissions.push === false) throw new Error("Token má k repozitáři jen čtení. Dej mu oprávnění Contents: Read and write.");
    GH.base = null; GH.sha = null;
    const remote = await GH.get();
    const hello = cfg.via === "login" ? `Přihlášen(a) jako ${cfg.name}.` : "Připojeno.";
    const done = msg => { GH.saveCfg(); saveLocal(); GH.saveBase(); GH.set("ok", "Aktuální z GitHubu " + GH.stamp()); renderAll(); toast(msg); };
    if (!remote) { GH.saveCfg(); await GH.put(); return done(`${hello} Data jsou uložená na GitHubu.`); }
    if (isEmpty() || S.demo || same(S, remote)) { S = remote; GH.base = clone(remote); return done(`${hello} Data načtena z GitHubu.`); }
    openDlg(`<h3 id="dlgTitle">Která data použít?</h3><p>Na GitHubu už data jsou (${pl(remote.students.length, "dítě", "děti", "dětí")}) a v tomto prohlížeči máš jiná (${pl(S.students.length, "dítě", "děti", "dětí")}). Obvykle chceš data z GitHubu, ta jsou společná pro všechny.</p>
      <div class="actions"><button class="btn danger left" id="g_local">Přepsat GitHub daty z prohlížeče</button><button class="btn primary" id="g_remote">Použít data z GitHubu</button></div>`, "#g_remote");
    $("#g_remote").onclick = () => { closeDlg(); S = remote; GH.base = clone(remote); done(`${hello} Data načtena z GitHubu.`); };
    $("#g_local").onclick = async () => { closeDlg(); GH.saveCfg(); try { GH.base = clone(remote); await GH.put(); done(`${hello} Data z prohlížeče jsou na GitHubu.`); } catch(e2) { GH.set("err", e2.message); renderAll(); } };
  } catch(e) { GH.cfg = null; GH.base = null; GH.state = "off"; err.textContent = e.message || "Připojení se nepovedlo."; paintSync(); }
}

  if (t.dataset.payall) { const s = student(t.dataset.payall), price = priceOf(s, U.ym);
    return commit(D => { const m = D.payments[U.ym] || (D.payments[U.ym] = {}), p = m[s.id] || (m[s.id] = {}); p.price = price; p.paid = price; if (!p.date) p.date = todayStr; }); }
  if (t.dataset.wage) { const tch = teacher(t.dataset.wage); return expenseDlg(null, {category:"Lektor", teacherId:tch.id, amount:Number(t.dataset.amount), forYm:U.ym, note:`Výplata za ${ymLabel(U.ym).toLowerCase()}`, date: U.ym < todayYm ? todayStr : `${U.ym}-${pad(daysIn(U.ym))}`}); }
  const act = t.dataset.act;
  if (act === "import") return $("#importFile").click();
  if (act === "xlsx-import") { loadXLSX().catch(() => {}); return $("#xlsxFile").click(); }
  if (act === "xlsx-export") return exportExcel();
  if (t.id === "accNewPass") { $("#acc_pass").value = newPassword(); return; }
  if (t.dataset.accDel) return delAccess(t.dataset.accDel);
  if (act === "export") return exportData();
  if (act === "demo" && GH.cfg) return toast("Ukázka by přepsala společná data na GitHubu. Nejdřív v Nastavení GitHub odpoj.");
  if (act === "demo") { const go = () => { S = demoData(); saveLocal(); GH.schedule(); U.ym = todayYm; location.hash = "#prehled"; renderAll(); toast("Načtena ukázková data."); };
    return isEmpty() ? go() : confirmDlg("Načíst ukázku?", "Ukázka přepíše všechna současná data. Pokud si je chceš nechat, stáhni si nejdřív zálohu.", "Přepsat ukázkou", go, true); }
  if (act === "wipe") return confirmDlg(S.demo ? "Smazat ukázku?" : "Smazat všechna data?", S.demo ? "Appka bude prázdná a můžeš nahrát svoje data." : GH.cfg ? "Smažou se všechny děti, kurzy, učitelé, platby i docházka, a to u všech, kdo appku používají. Předchozí verze zůstane jen v historii repozitáře na GitHubu." : "Smažou se všechny děti, kurzy, učitelé, platby i docházka.", "Smazat", () => {
    const g = S.demo ? null : S.settings.groups; S = blank(); S.settings.startYm = todayYm; if (g) S.settings.groups = g; S.updatedAt = new Date().toISOString(); saveLocal(); GH.schedule(); location.hash = "#prehled"; renderAll(); toast("Data smazána."); }, true);
  if (act === "groups") { const gs = $("#groupsInput").value.split(",").map(x => x.trim()).filter(Boolean); commit(D => { D.settings.groups = [...new Set(gs)]; }); return toast("Skupiny uloženy."); }
  if (act === "ghpush") return GH.push().then(renderAll);
  if (act === "ghpull") return GH.refresh().then(renderAll);
  if (act === "ghoff") return confirmDlg(GH.cfg && GH.cfg.via === "login" ? "Odhlásit se?" : "Odpojit GitHub?", "Data zůstanou na GitHubu. Z tohoto prohlížeče se smažou data i přihlášení.", GH.cfg && GH.cfg.via === "login" ? "Odhlásit" : "Odpojit", async () => {
    if (GH.state === "pending" || GH.state === "err") { try { await GH.push(); } catch(e2){} }
    clearTimeout(GH.timer); GH.cfg = null; GH.sha = null; GH.base = null; GH.saveCfg(); GH.state = "off"; S = blank(); S.settings.startYm = todayYm; saveLocal(); location.hash = "#nastaveni"; renderAll(); toast("Odhlášeno."); });
  if (act === "ghname") { const v = $("#gh_me").value.trim(); GH.cfg.name = v; GH.saveCfg(); return toast(v ? `Změny se v historii podepíšou jako ${v}.` : "Jméno smazáno."); }
});
document.addEventListener("submit", e => {
  if (e.target.id === "ghForm") { e.preventDefault(); connectGitHub(); }
  if (e.target.id === "loginForm") { e.preventDefault(); loginWith($("#lg_name").value.trim(), $("#lg_pass").value, $("#lgErr")); }
  if (e.target.id === "accessForm") { e.preventDefault(); addAccess(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDlg();
  const d = e.target.dataset || {};
  if (e.key === "Enter" && (d.kid || d.course || d.teacher || d.exp)) { e.preventDefault(); e.target.click(); }
  if (e.key === "Enter" && (d.pay || d.wk || d.wkn) && e.target.tagName === "INPUT") e.target.blur();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { U.q = t.value; render(); }
  if (t.id === "payQ") { U.payQ = t.value; renderKeepFocus(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "fGroup") { U.group = t.value; render(); }
  if (t.id === "fCourse") { U.course = t.value; render(); }
  if (t.id === "date" && t.value) { U.date = t.value; U.extraCourse = ""; render(); }
  if (t.id === "extraCourse" && t.value) { U.extraCourse = t.value; render(); }
  if (t.dataset.pay) { const f = t.dataset.pay; setPay(t.dataset.s, f, f === "price" || f === "paid" ? (t.value === "" ? "" : Number(t.value)) : t.value); }
  if (t.dataset.wk) { const d = t.dataset.wk, tid = t.dataset.t, v = t.value === "" ? null : Number(t.value);
    commit(D => { const w = D.work[d] || (D.work[d] = {hours:{}, note:""}); w.hours = w.hours || {}; if (v) w.hours[tid] = v; else delete w.hours[tid];
      if (!Object.keys(w.hours).length && !w.note) delete D.work[d]; }); return; }
  if (t.dataset.wkn) { const d = t.dataset.wkn, v = t.value.trim();
    commit(D => { const w = D.work[d] || (D.work[d] = {hours:{}, note:""}); w.note = v; if (!Object.keys(w.hours || {}).length && !w.note) delete D.work[d]; }); return; }
  if (t.dataset.note) { const cid = t.dataset.note, v = t.value.trim();
    commit(D => { const day = D.attendance[U.date] || (D.attendance[U.date] = {}), r = day[cid] || (day[cid] = {marks:{}, note:"", teacherIds:[...cT(course(cid))]}); r.note = v;
      if (!v && !Object.keys(r.marks||{}).length) delete day[cid]; if (!Object.keys(day).length) delete D.attendance[U.date]; }); toast("Zápis uložen."); }
  if (t.dataset.lt) { const cid = t.dataset.lt, ids = $$(`[data-lt="${cid}"]:checked`).map(x => x.value);
    commit(D => { const day = D.attendance[U.date] || (D.attendance[U.date] = {}), r = day[cid] || (day[cid] = {marks:{}, note:""}); r.teacherIds = ids; }); }
});
$("#xlsxFile").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) importExcel(f); });
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", e => { if (GH.cfg && (GH.state === "pending" || GH.state === "busy")) { GH.push(); e.preventDefault(); e.returnValue = ""; } });

/* =========================================================
   Start
   ========================================================= */
(async function start(){
  S = loadLocal() || normalize(blank());
  GH.load();
  route();
  if (GH.cfg) { await GH.refresh(); renderAll(); }
  setInterval(() => { if (GH.cfg && !document.hidden && GH.state !== "pending") GH.refresh(true); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && GH.cfg && GH.state !== "pending") GH.refresh(true); });
})();
</script>
</body>
</html>
